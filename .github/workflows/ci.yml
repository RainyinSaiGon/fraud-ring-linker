name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and check coverage floors
        working-directory: java
        run: mvn -B verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: java/*/target/site/jacoco/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: [java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Plant bugs in scoring and clustering, require tests to catch them
        working-directory: java
        run: mvn -B -Pmutation verify -pl engine
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: java/engine/target/pit-reports/
          if-no-files-found: ignore

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test with race detector
        working-directory: go
        run: go test -race ./...

  parity:
    name: Go and Java parity
    runs-on: ubuntu-latest
    needs: [java, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare outputs on synthetic datasets
        run: bash tools/parity/parity.sh 12
