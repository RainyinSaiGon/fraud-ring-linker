name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: No generated files committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject dependencies, build output, Maven files and large files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(node_modules|dist|target|build|\.gradle|test-results|playwright-report)/' || true)
          if [ -n "$bad" ]; then
            echo "These generated files are committed; remove them and check .gitignore:"
            echo "$bad" | head -20
            echo "($(echo "$bad" | wc -l) files in total)"
            exit 1
          fi
          # The Java build is Gradle only (epic #17); a pom.xml would be a second, unmaintained build.
          poms=$(git ls-files | grep -E '(^|/)pom\.xml$' || true)
          if [ -n "$poms" ]; then
            echo "Maven build files are committed, but the project builds with Gradle:"
            echo "$poms"
            exit 1
          fi
          large=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 2048 {print $2" ("$1" KB)"}')
          if [ -n "$large" ]; then
            echo "Files over 2 MB are committed:"
            echo "$large"
            exit 1
          fi
          echo "No generated or oversized files tracked."

  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and check coverage floors
        working-directory: java
        run: ./gradlew build
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: java/*/build/reports/jacoco/
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: [java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Plant bugs in scoring and clustering, require tests to catch them
        working-directory: java
        run: ./gradlew :engine:pitest
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: java/engine/build/reports/pitest/
          if-no-files-found: ignore

  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Test with race detector
        working-directory: go
        run: go test -race ./...

  web:
    name: Analyst page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type check and build
        working-directory: web
        run: npm run build
      - name: Component tests
        working-directory: web
        run: npm test
      - name: Build the service for the end-to-end test
        working-directory: java
        run: ./gradlew :service:bootJar
      - name: End-to-end test in Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  parity:
    name: Go and Java parity
    runs-on: ubuntu-latest
    needs: [java, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare outputs on synthetic datasets
        run: bash tools/parity/parity.sh 12

  simulator:
    name: Simulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        working-directory: tools/simulator
        run: npm test
