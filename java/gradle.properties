# Reuse the configuration phase and task outputs between builds.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Coverage floors for every module (see build-logic). Raise them as coverage grows; never lower them.
coverage.line.minimum=0.90
coverage.branch.minimum=0.70
# Share of planted bugs the tests must catch in the mutation-tested packages.
mutation.minimum=85
